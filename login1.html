    <script>
        // Alternância de abas
        function switchTab(tab) {
            const panelLogin = document.getElementById('panel-login');
            const panelCadastro = document.getElementById('panel-cadastro');
            const tabLogin = document.getElementById('tab-login');
            const tabCadastro = document.getElementById('tab-cadastro');
            const feedbackLogin = document.getElementById('feedback-login');
            const feedbackCadastro = document.getElementById('feedback-cadastro');

            // Esconde feedbacks ao trocar
            feedbackLogin.classList.add('hidden');
            feedbackCadastro.classList.add('hidden');

            if (tab === 'login') {
                panelLogin.classList.remove('hidden');
                panelCadastro.classList.add('hidden');
                tabLogin.className = 'flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-300 bg-white text-lilas shadow-sm';
                tabCadastro.className = 'flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-300 text-gray-500 hover:text-gray-800';
                setTimeout(() => document.getElementById('login-nome').focus(), 150);
            } else {
                panelCadastro.classList.remove('hidden');
                panelLogin.classList.add('hidden');
                tabCadastro.className = 'flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-300 bg-white text-lilas shadow-sm';
                tabLogin.className = 'flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-300 text-gray-500 hover:text-gray-800';
                setTimeout(() => document.getElementById('cadastro-nome').focus(), 150);
            }
        }

        // Mostrar/ocultar senha
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Exibe feedback temporário
        function showFeedback(panelId, message, type) {
            const feedback = document.getElementById('feedback-' + panelId);
            feedback.textContent = message;
            feedback.className = 'mt-4 text-center text-sm font-medium animate-fadeInUp p-3 rounded-xl ' + 
                (type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
            feedback.classList.remove('hidden');
            clearTimeout(feedback._timeout);
            feedback._timeout = setTimeout(() => {
                feedback.classList.add('hidden');
            }, 4000);
        }

        // Valida e processa login (simulação)
        function handleLogin(event) {
            event.preventDefault();
            const nome = document.getElementById('login-nome').value.trim();
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;

            if (!nome || !email || !senha) {
                showFeedback('login', '⚠️ Preencha todos os campos.', 'error');
                return;
            }
            if (senha.length < 3) {
                showFeedback('login', '⚠️ A senha deve ter pelo menos 3 caracteres.', 'error');
                return;
            }
            // Aqui sua equipe fará a chamada à API real
            console.log('Login enviado:', { nome, email, senha });
            showFeedback('login', '✅ Bem-vindo de volta, ' + nome.split(' ')[0] + '!', 'success');
        }

        // Valida e processa cadastro (simulação)
        function handleCadastro(event) {
            event.preventDefault();
            const nome = document.getElementById('cadastro-nome').value.trim();
            const email = document.getElementById('cadastro-email').value.trim();
            const senha = document.getElementById('cadastro-senha').value;

            if (!nome || !email || !senha) {
                showFeedback('cadastro', '⚠️ Preencha todos os campos.', 'error');
                return;
            }
            if (senha.length < 6) {
                showFeedback('cadastro', '⚠️ A senha precisa de no mínimo 6 caracteres.', 'error');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                showFeedback('cadastro', '⚠️ Insira um email válido.', 'error');
                return;
            }
            // Aqui sua equipe fará a chamada à API real
            console.log('Cadastro enviado:', { nome, email, senha });
            showFeedback('cadastro', '🎉 Conta criada com sucesso! Bem-vindo, ' + nome.split(' ')[0] + '!', 'success');
            document.getElementById('form-cadastro').reset();
        }

        // Foco inicial
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-nome').focus();
        });

        // Suporte extra para links inferiores (caso sejam usados como <a>)
        document.querySelectorAll('[onclick*="switchTab"]').forEach(el => {
            if (el.tagName === 'A') {
                el.addEventListener('click', (e) => e.preventDefault());
            }
        });
    </script>
